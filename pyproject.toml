[build-system]
build-backend = "uv_build"
requires = ["uv_build>=0.13.5,<0.14.0"]

[project]
name = "aiosqlite"
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
maintainers = [{name = "NTFSvolume", email = "NTFSvolume@proton.me"}]
version = "0.22.1"
authors = [
    {name="Amethyst Reese", email="amethyst@n7.gg"},
]
classifiers = [
    "Development Status :: 5 - Production/Stable",
    "Framework :: AsyncIO",
    "Intended Audience :: Developers",
    "Topic :: Software Development :: Libraries",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Programming Language :: Python :: 3.15"
]
requires-python = ">=3.11"

[dependency-groups]
dev = [
    "coverage>=7.17.5",
    "ruff>=0.17.4,<0.18.0",
    "mypy>=2.4.1",
]

[project.urls]
Github = "https://github.com/NTFSvolume/aiosqlite"

[tool.coverage.run]
branch = true
include = ["aiosqlite/*"]
omit = ["aiosqlite/tests/*"]

[tool.coverage.report]
fail_under = 75
precision = 1
show_missing = true
skip_covered = true

[tool.mypy]
ignore_missing_imports = true
python_version = "3.11"

[[tool.mypy.overrides]]
module = "aiosqlite.tests.perf"
follow_imports = "silent"

[tool.uv]
default-groups = "all"
required-version = ">=0.13.5"

[tool.uv.build-backend]
module-name = ["aiosqlite"]
module-root = ""
source-include = ["CHANGELOG.md", "README.md"]
